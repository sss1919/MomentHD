name: Build HD Moments Tweak

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # 手动触发

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos
        run: |
          brew install ldid make
          sudo mkdir -p /opt/theos
          sudo chown -R $(whoami) /opt/theos
          git clone --recursive https://github.com/theos/theos.git /opt/theos

      - name: Set SDK
        run: |
          # 找到 Xcode 自带的 iPhoneOS SDK
          SDK_DIR=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK: $SDK_DIR"
          # Theos 使用 Xcode 自带 SDK,无需额外下载
          # 设置 Theos 环境变量
          echo "THEOS=/opt/theos" >> $GITHUB_ENV

      - name: Build
        run: |
          make clean || true
          make package FINALPACKAGE=1 \
            THEOS_PACKAGE_SCHEME=rootless \
            DISABLE_ROOTLESS_COMPAT_WARNING=1

      - name: Verify deb
        run: |
          echo "=== Built packages ==="
          ls -lh packages/*.deb
          echo "=== Verify ==="
          DEB=$(ls packages/*.deb | head -1)
          ar t "$DEB"
          echo "--- control ---"
          ar p "$DEB" control.tar.gz | tar xz -O ./control || ar p "$DEB" control.tar.gz | tar xz -O control/control
          echo "--- data ---"
          ar p "$DEB" data.tar.* | tar t -

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: hd-moments-deb
          path: packages/*.deb
          retention-days: 30
